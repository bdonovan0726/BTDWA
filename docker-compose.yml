version: "3.9"

services:
 land_obs_cache:
  build: .
  command: python NWS_land_cache_svc.py -d 900
  volumes:
  - ./Data:/app/Data

 land_obs_api:
  build: .
  command: python NWS_api.py
  volumes:
  - ./Data:/app/Data

 land_forecast_cache:
  build: .
  command: python NWS_land_forecast_svc.py -d 2400
  volumes:
  - ./Data:/app/Data

 land_forecast_api:
  build: .
  command: python SG_Land_Forecast_API.py
  volumes:
  - ./Data:/app/Data
