version: "3.9"

services:
 land_obs_cache:
  build: .
  command: python NWS_land_cache_svc.py -d 180
  volumes:
  - ./Data:/app/Data

 land_obs_api:
  build: .
  command: python NWS_api.py
  ports:
  - "5000:5000"
  volumes:
  - ./Data:/app/Data

 land_forecast_cache:
  build: .
  command: python NWS_land_forecast_svc.py -d 180
  volumes:
  - ./Data:/app/Data

 land_forecast_api:
  build: .
  command: python SG_Land_Forecast_API.py
  ports:
  - "5008:5008"
  volumes:
  - ./Data:/app/Data
