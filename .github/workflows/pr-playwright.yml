name: PR Playwright Tests

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build and start app stack
        run: docker compose --profile local up -d --build

      - name: Show running containers
        run: docker ps

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost > /dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            echo "Waiting for frontend..."
            sleep 2
          done

          echo "Frontend failed to start"
          docker compose logs
          exit 1

      - name: Wait for observations API through nginx
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost/api/observations > /dev/null; then
              echo "Observations API is up"
              exit 0
            fi
            echo "Waiting for observations API..."
            sleep 2
          done

          echo "Observations API failed to start"
          docker compose logs
          exit 1

      - name: Run Playwright tests
        env:
          BASE_URL: http://localhost
          CI: true
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Print Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Shutdown containers
        if: always()
        run: docker compose --profile local down -v